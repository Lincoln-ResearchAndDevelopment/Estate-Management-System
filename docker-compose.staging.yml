# Whole stack on any Docker host:  cp .env.staging.example .env.staging && docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: lincoln_estate_staging
      MYSQL_USER: estate
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, retries: 20 }
  api:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${API_PUBLIC_URL}
      FRONTEND_URL: ${WEB_PUBLIC_URL}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: lincoln_estate_staging
      DB_USERNAME: estate
      DB_PASSWORD: ${DB_PASSWORD}
      ESTATE_ENFORCE_AUTH: "true"
      ESTATE_EMERGENCY_CONTACTS: ${ESTATE_EMERGENCY_CONTACTS}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA}
      MAIL_MAILER: log
    ports: ["8000:80"]
  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "${API_PUBLIC_URL}/api/v1" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  dbdata:
